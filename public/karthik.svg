<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="headClip">
      <circle cx="200" cy="180" r="72"/>
    </clipPath>
  </defs>

  <rect width="400" height="500" rx="0" fill="url(#bg)"/>

  <!-- decorative rings -->
  <circle cx="200" cy="250" r="190" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="250" r="150" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.25"/>

  <!-- head -->
  <circle cx="200" cy="180" r="72" fill="#f1f5f9"/>
  <g clip-path="url(#headClip)">
    <!-- hair -->
    <path d="M128 170 Q130 110 200 105 Q270 110 272 170 L272 150 Q268 128 200 124 Q132 128 128 150 Z" fill="#1e293b"/>
    <path d="M132 175 Q140 140 200 138 Q260 140 268 175 L268 162 Q255 145 200 143 Q145 145 132 162 Z" fill="#334155"/>
  </g>
  <!-- eyes -->
  <circle cx="178" cy="178" r="5" fill="#0f172a"/>
  <circle cx="222" cy="178" r="5" fill="#0f172a"/>
  <!-- smile -->
  <path d="M182 198 Q200 212 218 198" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="188" y="248" width="24" height="30" fill="#e2e8f0"/>
  <!-- shoulders / body -->
  <path d="M120 500 Q120 340 200 310 Q280 340 280 500 Z" fill="#0f172a"/>
  <path d="M140 500 Q140 360 200 330 Q260 360 260 500 Z" fill="#1e293b"/>
  <!-- collar accent -->
  <path d="M175 330 L200 360 L225 330" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- name tag -->
  <rect x="130" y="430" width="140" height="34" rx="17" fill="rgba(0,0,0,0.35)"/>
  <text x="200" y="453" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Karthik Anaboina</text>

  <!-- floating dots -->
  <circle cx="70" cy="120" r="4" fill="#2dd4bf" opacity="0.7"/>
  <circle cx="330" cy="90" r="3" fill="#f43f5e" opacity="0.6"/>
  <circle cx="340" cy="200" r="5" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="55" cy="260" r="3" fill="#fb7185" opacity="0.5"/>
</svg>
